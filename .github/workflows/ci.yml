name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run test:ui
      - run: npm run build
      - run: npm run format:check
      - run: cargo fmt --all -- --check
      - run: cargo test -p mosaic-core --locked
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run tauri build -- --debug
